<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>calibre-helper test page</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; line-height: 1.6; }
  button { padding: 0.5rem 1rem; margin: 0.25rem 0; }
  pre { background: #f4f4f4; padding: 0.75rem; white-space: pre-wrap; word-break: break-all; }
  .ok { color: green; }
  .ng { color: red; }
</style>
</head>
<body>
<h1>calibre-helper test page</h1>
<p>This page fetches the helper at <code>http://127.0.0.1:47821</code> from <code>http://localhost</code>,
to check whether it works across CORS / Private Network Access.</p>

<h2>1. Health check</h2>
<button id="healthBtn">GET /health</button>
<pre id="healthOut">(not run yet)</pre>

<h2>2. Convert a file</h2>
<input type="file" id="fileInput" />
<button id="convertBtn">Send to /convert &rarr; make EPUB</button>
<pre id="convertOut">(not run yet)</pre>

<script>
const HELPER_URL = 'http://127.0.0.1:47821';

document.getElementById('healthBtn').onclick = async () => {
  const out = document.getElementById('healthOut');
  out.textContent = 'Checking... (the browser may show a local network access permission prompt the first time)';
  try {
    const res = await fetch(HELPER_URL + '/health');
    const json = await res.json();
    out.textContent = JSON.stringify(json, null, 2);
    out.className = json.found ? 'ok' : 'ng';
  } catch (e) {
    out.textContent = 'Error: ' + e;
    out.className = 'ng';
  }
};

document.getElementById('convertBtn').onclick = async () => {
  const out = document.getElementById('convertOut');
  const file = document.getElementById('fileInput').files[0];
  if (!file) { out.textContent = 'Please choose a file first'; return; }
  out.textContent = 'Converting...';
  try {
    const fd = new FormData();
    fd.append('file', file, file.name);
    fd.append('to', 'epub');
    const res = await fetch(HELPER_URL + '/convert', { method: 'POST', body: fd });
    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      out.textContent = 'Error (' + res.status + '): ' + JSON.stringify(errJson, null, 2);
      out.className = 'ng';
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    out.innerHTML = '';
    out.className = 'ok';
    const a = document.createElement('a');
    a.href = url;
    a.download = (file.name.replace(/\.[^.]+$/, '') || 'converted') + '.epub';
    a.textContent = 'Success: download ' + a.download + ' (' + blob.size + ' bytes)';
    out.appendChild(a);
  } catch (e) {
    out.textContent = 'Error: ' + e;
    out.className = 'ng';
  }
};
</script>
</body>
</html>
