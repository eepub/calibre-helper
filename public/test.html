<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>calibre-helper 試作テストページ</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; line-height: 1.6; }
  button { padding: 0.5rem 1rem; margin: 0.25rem 0; }
  pre { background: #f4f4f4; padding: 0.75rem; white-space: pre-wrap; word-break: break-all; }
  .ok { color: green; }
  .ng { color: red; }
</style>
</head>
<body>
<h1>calibre-helper 試作テストページ</h1>
<p>このページは <code>http://localhost</code> から <code>http://127.0.0.1:47821</code> のヘルパーへ実際にfetchし、
CORS/Private Network Access越しに動くかを確認するためのものです。</p>

<h2>1. ヘルスチェック</h2>
<button id="healthBtn">GET /health</button>
<pre id="healthOut">(未実行)</pre>

<h2>2. ファイル変換</h2>
<input type="file" id="fileInput" />
<button id="convertBtn">/convert に送信 → EPUB化</button>
<pre id="convertOut">(未実行)</pre>

<script>
const HELPER_URL = 'http://127.0.0.1:47821';

document.getElementById('healthBtn').onclick = async () => {
  const out = document.getElementById('healthOut');
  out.textContent = '問い合わせ中...(初回はブラウザのローカルネットワークアクセス許可ダイアログが出ることがあります)';
  try {
    const res = await fetch(HELPER_URL + '/health');
    const json = await res.json();
    out.textContent = JSON.stringify(json, null, 2);
    out.className = json.found ? 'ok' : 'ng';
  } catch (e) {
    out.textContent = 'エラー: ' + e;
    out.className = 'ng';
  }
};

document.getElementById('convertBtn').onclick = async () => {
  const out = document.getElementById('convertOut');
  const file = document.getElementById('fileInput').files[0];
  if (!file) { out.textContent = 'ファイルを選択してください'; return; }
  out.textContent = '変換中...';
  try {
    const fd = new FormData();
    fd.append('file', file, file.name);
    fd.append('to', 'epub');
    const res = await fetch(HELPER_URL + '/convert', { method: 'POST', body: fd });
    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      out.textContent = 'エラー(' + res.status + '): ' + JSON.stringify(errJson, null, 2);
      out.className = 'ng';
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    out.innerHTML = '';
    out.className = 'ok';
    const a = document.createElement('a');
    a.href = url;
    a.download = (file.name.replace(/\.[^.]+$/, '') || 'converted') + '.epub';
    a.textContent = '変換成功: ' + a.download + ' をダウンロード (' + blob.size + ' bytes)';
    out.appendChild(a);
  } catch (e) {
    out.textContent = 'エラー: ' + e;
    out.className = 'ng';
  }
};
</script>
</body>
</html>
